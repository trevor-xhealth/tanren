## Tanren prod compose profile.
##
## All required secrets must be provided through operator env. There are no
## fallbacks. Missing any required variable causes `docker compose config` /
## `docker compose up` to fail with a clear error.
##
## Required env (note: every prod SECRET is a HOST PATH to a mounted file — `*_FILE`
## / `*_KEY_FILE` — never a plaintext secret VALUE, so no secret transits Docker env /
## `docker inspect` / `/proc/<pid>/environ`):
##   TANREN_VAULT_TOKEN_FILE             HOST path to a file containing the broad Vault token. Wired below as the
##                                       `tanren_vault_token` compose secret mounted at /run/secrets/tanren_vault_token.
##                                       It is the SINGLE source for BOTH the Vault server's dev-mode ROOT token (the
##                                       `vault` entrypoint reads the file to seed `-dev-root-token-id` as an argv, NOT
##                                       a declared env) AND the broad CLIENT token the orchestrator + worker read
##                                       (VAULT_TOKEN_FILE). The old plaintext `VAULT_ROOT_TOKEN` env is GONE.
##   POSTGRES_PASSWORD                   Postgres password for the tanren user.
##   TANREN_APP_DB_PASSWORD              Password for the restricted `tanren_app` (NOBYPASSRLS) runtime role.
##   TANREN_SYSTEM_DB_PASSWORD           Password for the BYPASSRLS `tanren_system` role.
##   TANREN_DATAPLANE_DB_PASSWORD        Password for the de-privileged `tanren_dataplane` worker role.
##   TANREN_GITHUB_OAUTH_CLIENT_ID       GitHub OAuth app client id (NOT secret; safe in env).
##   TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE  HOST path to a file containing the GitHub OAuth app client SECRET. Wired
##                                       below as the `tanren_github_oauth_client_secret` compose secret mounted at
##                                       /run/secrets/tanren_github_oauth_client_secret; mainAuth reads it file-preferred
##                                       (TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE), never as an env VALUE.
##   TANREN_ALLOCATOR_TOKEN_FILE         HOST path to a file containing the allocator sidecar bearer token. Wired below
##                                       as the `tanren_allocator_token` compose secret mounted at
##                                       /run/secrets/tanren_allocator_token; the orchestrator + worker + allocator all
##                                       read it file-preferred (TANREN_ALLOCATOR_TOKEN_FILE), never as an env VALUE.
##   TANREN_RUNNER_AUTHORIZED_KEY        SSH authorized_keys entry the orchestrator uses (PUBLIC key line; safe in env).
##   TANREN_RUNNER_IDENTITY_KEY_FILE     HOST path to the PRIVATE key file the orchestrator uses to SSH into runners.
##                                       Wired below as a compose `secret` mounted into the orchestrator + worker at
##                                       /run/secrets/tanren_runner_identity_key; the services read the key from that
##                                       file (TANREN_RUNNER_IDENTITY_KEY_PATH), so the key material is delivered as a
##                                       mounted SECRET FILE, never as an env VALUE — it never transits Docker env /
##                                       `docker inspect`. Self-contained: just point this at the key file on the host.
##   TANREN_PUBLIC_BASE_URL              Absolute URL the orchestrator is reachable at (used for OAuth redirect URI).
##   TANREN_INTERNAL_TLS_CERT            Control-plane internal mTLS server cert path mounted in the orchestrator.
##   TANREN_INTERNAL_TLS_KEY             Control-plane internal mTLS server key path mounted in the orchestrator.
##   TANREN_INTERNAL_TLS_CA              CA path mounted in the orchestrator; signs trusted data-plane client certs.
##   TANREN_CLAIM_ENDPOINT_URL           Internal mTLS base URL the worker uses for claims and run-state writes.
##   TANREN_DATA_PLANE_TLS_CERT          Data-plane client cert path mounted in the worker.
##   TANREN_DATA_PLANE_TLS_KEY           Data-plane client key path mounted in the worker.
##   TANREN_DATA_PLANE_TLS_CA            CA path mounted in the worker; verifies the control-plane server cert.
##
## Optional env:
##   DASHBOARD_HOST_PORT                 Host port to publish the dashboard on (default 3000).
##   TANREN_MAX_RUN_HOURS                Max wall-clock hours before the allocator reclaims an abandoned runner (default 6).
##   CLOUDFLARED_TUNNEL_TOKEN            Cloudflare Tunnel token. Required only when running the `tunnel` profile
##                                       (`docker compose -f compose.prod.yml --profile tunnel up`). Never commit it;
##                                       supply via env / secret manager. See docs/operator-guide/deploy.md.
##   TANREN_OIDC_PRESET                  Turnkey claim-mapping preset (e.g. `authentik`). Fills Authentik's standard
##                                       claim shape + scopes so you only supply issuer + client id/secret. Optional;
##                                       explicit TANREN_OIDC_* envs override it. See docs/operator-guide/oidc-authentik.md.
##   TANREN_OIDC_ISSUER                  OIDC issuer URL (e.g. https://authentik.example.com/application/o/tanren).
##   TANREN_OIDC_CLIENT_ID               OIDC confidential-client id. Registers the `oidc` provider when set with the secret.
##   TANREN_OIDC_CLIENT_SECRET           OIDC confidential-client secret.
##   TANREN_OIDC_SCOPES                  Space-separated scopes (default `openid profile email groups`).
##   TANREN_OIDC_SUBJECT_CLAIM           userinfo claim used as the stable subject (default `sub`).
##   TANREN_OIDC_LOGIN_CLAIM             userinfo claim used as the login (default `preferred_username`).
##   TANREN_OIDC_NAME_CLAIM              userinfo claim used as the display name (default `name`).
##   TANREN_OIDC_GROUPS_CLAIM            userinfo claim carrying org/group membership (default `groups`).
##
## Only the dashboard publishes a host port. Postgres, Vault, orchestrator,
## allocator, runner SSH, and ntfy are reachable only on the internal docker
## network. The Docker socket is mounted only into the allocator sidecar;
## per-run runner containers are created and destroyed by the allocator and
## never publish a host port in prod.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tanren
      POSTGRES_USER: tanren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the prod profile}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanren -d tanren"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql

  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ## Vault server runs in dev mode with the operator-supplied root token. The
    ## token is delivered as a MOUNTED SECRET FILE (the `tanren_vault_token` compose
    ## secret), NOT a `${VAULT_ROOT_TOKEN}` env value — so it never lands in the
    ## compose-rendered `environment:` block / `docker compose config` /
    ## `docker inspect`. The entrypoint reads it from /run/secrets at boot and execs
    ## the dev server with `-dev-root-token-id` (passed as an argv, not a declared
    ## env). The operator is expected to rotate to a SEALED production Vault (proper
    ## init/unseal) before exposing the stack publicly; the dev-mode container is a
    ## phase-2 placeholder. See docs/operator-guide/deploy.md.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        VAULT_DEV_ROOT_TOKEN_ID="$(cat /run/secrets/tanren_vault_token)"
        if [ -z "$$VAULT_DEV_ROOT_TOKEN_ID" ]; then
          echo "tanren_vault_token secret file is empty (no Vault root token)" >&2
          exit 1
        fi
        exec vault server -dev -dev-root-token-id="$$VAULT_DEV_ROOT_TOKEN_ID"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    ## The Vault root token, mounted as a file (never an env VALUE). Same secret the
    ## orchestrator + worker read as the broad VAULT_TOKEN_FILE — they must hold the
    ## same value.
    secrets:
      - tanren_vault_token

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    # The broad Vault token is delivered as a MOUNTED SECRET FILE (the
    # `tanren_vault_token` compose secret, wired below). The SecretStore factory
    # reads the token FROM THE FILE at boot (VAULT_TOKEN_FILE, below) and holds it
    # in-memory — it is NEVER force-exported into VAULT_TOKEN in the process env, so
    # the broad token never lands in `/proc/<pid>/environ`, `docker inspect`, or any
    # inherited child (incl. the runner SSH subprocess). Mirrors the SSH runner-key
    # secret-file pattern (TANREN_RUNNER_IDENTITY_KEY_PATH below).
    command: ["pnpm", "--filter", "@tanren/orchestrator", "start"]
    environment:
      # RLS R3b (enforcement flip). The RUNTIME connects as the restricted
      # `tanren_app` role (NOBYPASSRLS) so the policies enabled in migration 0030
      # enforce org isolation at the DB. Migrations run as the OWNER
      # (MIGRATION_DATABASE_URL = `tanren`). `runWithSystemScope` uses the narrow
      # BYPASSRLS `tanren_system` role (TANREN_SYSTEM_DATABASE_URL). The operator
      # rotates the app/system role passwords out-of-band
      # (`ALTER ROLE tanren_app PASSWORD …`) and supplies them here.
      DATABASE_URL: postgres://tanren_app:${TANREN_APP_DB_PASSWORD:?TANREN_APP_DB_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      MIGRATION_DATABASE_URL: postgres://tanren:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      TANREN_SYSTEM_DATABASE_URL: postgres://tanren_system:${TANREN_SYSTEM_DB_PASSWORD:?TANREN_SYSTEM_DB_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      # The secret-store backend is now REQUIRED (no implicit `vault` default).
      TANREN_SECRET_STORE: vault
      VAULT_ADDR: http://vault:8200
      # The broad Vault token is delivered as a MOUNTED SECRET FILE, never an env
      # VALUE: point the SecretStore factory at the mounted secret path so it reads
      # the token from the file at boot (in-memory). VAULT_TOKEN is intentionally
      # NOT set — the broad token is never force-exported into the process env.
      VAULT_TOKEN_FILE: /run/secrets/tanren_vault_token
      ORCHESTRATOR_PORT: "3100"
      # SYSTEM credential split: the orchestrator's SSH PRIVATE key is delivered as
      # a MOUNTED SECRET FILE (the `tanren_runner_identity_key` compose secret,
      # wired below), never as a Docker env VALUE — so the key material never lands
      # in `docker inspect` / container env. The boot seeder reads the file at this
      # in-container path and stores it in the secret store.
      TANREN_RUNNER_IDENTITY_KEY_PATH: /run/secrets/tanren_runner_identity_key
      TANREN_GITHUB_OAUTH_CLIENT_ID: ${TANREN_GITHUB_OAUTH_CLIENT_ID:?TANREN_GITHUB_OAUTH_CLIENT_ID must be set for the prod profile}
      # The OAuth client SECRET is delivered as a MOUNTED SECRET FILE (the
      # `tanren_github_oauth_client_secret` compose secret, wired below), never an env
      # VALUE — so it never lands in `docker inspect` / `/proc/<pid>/environ`. mainAuth
      # reads it file-preferred (optionalSecretFromFileOrEnv) from this path.
      TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE: /run/secrets/tanren_github_oauth_client_secret
      TANREN_PUBLIC_BASE_URL: ${TANREN_PUBLIC_BASE_URL:?TANREN_PUBLIC_BASE_URL must be set for the prod profile}
      TANREN_ALLOCATOR_URL: http://allocator:3200
      # The allocator sidecar bearer token is delivered as a MOUNTED SECRET FILE (the
      # `tanren_allocator_token` compose secret, wired below), never an env VALUE.
      # buildAllocator reads it file-preferred (requireSecretFromFileOrEnv).
      TANREN_ALLOCATOR_TOKEN_FILE: /run/secrets/tanren_allocator_token
      TANREN_COOKIE_SECURE: "1"
      ## P3-0030: Authentik/OIDC as a second identity provider. Additive and
      ## opt-in — the orchestrator registers the `oidc` provider only when all of
      ## issuer + client id + client secret are set; absent values leave
      ## github_oauth behavior unchanged. Defaults to empty so the prod profile
      ## boots with GitHub OAuth only when these are not supplied.
      TANREN_OIDC_PRESET: ${TANREN_OIDC_PRESET:-}
      TANREN_OIDC_ISSUER: ${TANREN_OIDC_ISSUER:-}
      TANREN_OIDC_CLIENT_ID: ${TANREN_OIDC_CLIENT_ID:-}
      # RESIDUAL (Codex r5): the OIDC client SECRET is still a soft-default env
      # passthrough — empty by default, so the base prod config renders no secret
      # VALUE. Moving it to a `*_FILE` mount requires the OIDC env reader
      # (services/orchestrator/src/auth/oidcEnv.ts) to support file-preferred
      # resolution; that reader is owned by a separate in-flight change, so the
      # `_FILE` wiring lands there. When OIDC is enabled, supply this via env / a
      # secret manager and never commit it.
      TANREN_OIDC_CLIENT_SECRET: ${TANREN_OIDC_CLIENT_SECRET:-}
      TANREN_OIDC_SCOPES: ${TANREN_OIDC_SCOPES:-}
      TANREN_OIDC_SUBJECT_CLAIM: ${TANREN_OIDC_SUBJECT_CLAIM:-}
      TANREN_OIDC_LOGIN_CLAIM: ${TANREN_OIDC_LOGIN_CLAIM:-}
      TANREN_OIDC_NAME_CLAIM: ${TANREN_OIDC_NAME_CLAIM:-}
      TANREN_OIDC_GROUPS_CLAIM: ${TANREN_OIDC_GROUPS_CLAIM:-}
      # Plane-split P2/P3b: prod requires the control-plane internal mTLS
      # listener because the standalone worker claims jobs and posts run-state
      # writes through `/internal/*`. These paths must point at operator-mounted
      # cert material. Keep this listener on the private control↔data network;
      # never publish its port.
      TANREN_INTERNAL_MTLS_PORT: ${TANREN_INTERNAL_MTLS_PORT:-3110}
      TANREN_INTERNAL_TLS_CERT: ${TANREN_INTERNAL_TLS_CERT:?TANREN_INTERNAL_TLS_CERT must be set for the prod profile}
      TANREN_INTERNAL_TLS_KEY: ${TANREN_INTERNAL_TLS_KEY:?TANREN_INTERNAL_TLS_KEY must be set for the prod profile}
      TANREN_INTERNAL_TLS_CA: ${TANREN_INTERNAL_TLS_CA:?TANREN_INTERNAL_TLS_CA must be set for the prod profile}
      # Plane-split topology: prod runs the data plane in the standalone
      # `worker` service. Keep the API process out of the run-worker loop even if
      # operator env contains TANREN_RUN_WORKER=1.
      TANREN_RUN_WORKER: ""
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3100/healthz")
            .then(async (response) => {
              if (!response.ok) process.exit(1);
              const body = await response.json();
              if (body.ok !== true) process.exit(1);
            })
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      allocator:
        condition: service_started
    # Mount the SSH PRIVATE key, the broad Vault token, the GitHub OAuth client
    # secret, and the allocator bearer token as files under /run/secrets, not as env
    # values.
    secrets:
      - tanren_runner_identity_key
      - tanren_vault_token
      - tanren_github_oauth_client_secret
      - tanren_allocator_token

  worker:
    # Plane-split P1: the run-executor worker as a STANDALONE deployable (the
    # DATA PLANE). Same image as the orchestrator, booting ONLY the worker loop
    # (`worker-main.ts`) — no HTTP server, publishes no host port. The
    # orchestrator API no longer runs the worker in-process; this container
    # claims jobs from `job_queue` (unchanged DB-CAS) and drives the
    # plan→write→check→audit loop via the sidecar allocator's ephemeral runners.
    # P1 is a process-boundary change only. P2 (DONE): the worker now CLAIMS over
    # the orchestrator's mTLS `/internal/claim-job` endpoint when
    # TANREN_CLAIM_ENDPOINT_URL + the data-plane cert paths below are supplied
    # (else it falls back to the direct DB-CAS). P3 routes the WRITES + de-privileges
    # to per-run creds. See ROADMAP.md.
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    # The broad Vault token is delivered as a MOUNTED SECRET FILE (VAULT_TOKEN_FILE,
    # below), never force-exported into the process env — same file-delivery pattern
    # as the orchestrator + the SSH key. The SecretStore factory reads the token from
    # the mounted file at boot.
    command: ["pnpm", "--filter", "@tanren/orchestrator", "start:worker"]
    environment:
      # Plane-split P3b (the de-privilege CUTOVER): the data plane connects as the
      # DE-PRIVILEGED `tanren_dataplane` role (migration 0031) — NO write grant on
      # `events`/`cost_records` (it writes those ONLY via the control plane once
      # remote-writes is on, below). The reaper's cross-org lineage read still uses
      # the BYPASSRLS `tanren_system` pool (a READ-only system concern). The worker
      # does NOT migrate (the orchestrator owns it — `depends_on` below), so it
      # carries no MIGRATION_DATABASE_URL.
      DATABASE_URL: postgres://tanren_dataplane:${TANREN_DATAPLANE_DB_PASSWORD:?TANREN_DATAPLANE_DB_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      TANREN_SYSTEM_DATABASE_URL: postgres://tanren_system:${TANREN_SYSTEM_DB_PASSWORD:?TANREN_SYSTEM_DB_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      # The secret-store backend is now REQUIRED (no implicit `vault` default).
      TANREN_SECRET_STORE: vault
      VAULT_ADDR: http://vault:8200
      # The broad Vault token is read from the mounted secret FILE at boot (never an
      # env VALUE, never force-exported) — same as the orchestrator above.
      VAULT_TOKEN_FILE: /run/secrets/tanren_vault_token
      # SSH PRIVATE key via the mounted secret FILE (the `tanren_runner_identity_key`
      # compose secret), not an env value — same as the orchestrator above; the
      # worker seeds the same runner identity.
      TANREN_RUNNER_IDENTITY_KEY_PATH: /run/secrets/tanren_runner_identity_key
      # Same sidecar allocator the orchestrator uses (ephemeral runners on demand).
      TANREN_ALLOCATOR_URL: http://allocator:3200
      # Allocator bearer token via the mounted secret FILE (not an env value) — same
      # file-preferred read as the orchestrator above.
      TANREN_ALLOCATOR_TOKEN_FILE: /run/secrets/tanren_allocator_token
      # Plane-split P2/P3b: claim over the control-plane mTLS endpoint. The
      # endpoint URL + data-plane client cert paths are required in prod because
      # the worker is de-privileged and remote-writes is enabled by default.
      TANREN_CLAIM_ENDPOINT_URL: ${TANREN_CLAIM_ENDPOINT_URL:?TANREN_CLAIM_ENDPOINT_URL must be set for the prod profile}
      TANREN_DATA_PLANE_TLS_CERT: ${TANREN_DATA_PLANE_TLS_CERT:?TANREN_DATA_PLANE_TLS_CERT must be set for the prod profile}
      TANREN_DATA_PLANE_TLS_KEY: ${TANREN_DATA_PLANE_TLS_KEY:?TANREN_DATA_PLANE_TLS_KEY must be set for the prod profile}
      TANREN_DATA_PLANE_TLS_CA: ${TANREN_DATA_PLANE_TLS_CA:?TANREN_DATA_PLANE_TLS_CA must be set for the prod profile}
      # Plane-split P3b (the CUTOVER): remote-writes is ON BY DEFAULT — the worker
      # routes its run-state WRITES (event-append, cost-record insert, run finalize)
      # AND the reaper's dead-letter event through the control-plane `/internal/*`
      # endpoints over mTLS, so it writes `events`/`cost_records` only via the
      # control plane (matching the de-privileged role above). The operator MUST
      # supply the claim/write endpoint URL + the data-plane mTLS certs above —
      # with remote-writes on but no endpoint/certs the worker refuses to start
      # (buildRunStateWriterFromEnv throws) rather than silently writing directly.
      # See ROADMAP.md.
      TANREN_DATA_PLANE_REMOTE_WRITES: ${TANREN_DATA_PLANE_REMOTE_WRITES:-1}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      allocator:
        condition: service_started
      # The orchestrator owns the migrate step; wait for it before claiming jobs.
      orchestrator:
        condition: service_healthy
    # Same SSH PRIVATE key + Vault token + allocator-token file mounts as the
    # orchestrator.
    secrets:
      - tanren_runner_identity_key
      - tanren_vault_token
      - tanren_allocator_token

  allocator:
    build:
      context: .
      dockerfile: services/allocator/Dockerfile
    environment:
      # RLS R3b: the allocator is partly a cross-org SYSTEM service (it reaps
      # runners across all tenants) and partly a per-run tenant writer. Migrations
      # run as owner (MIGRATION_DATABASE_URL). It runs TWO runtime pools:
      #  - DATABASE_URL = the RESTRICTED `tanren_app` (NOBYPASSRLS) role, used ONLY
      #    through `runWithOrgScope` for the per-run `runners` INSERT, so that
      #    tenant row is written WITHIN RLS (de-priv); and
      #  - TANREN_SYSTEM_DATABASE_URL = the BYPASSRLS `tanren_system` role, for the
      #    genuinely cross-org sweep/reap + runner_id-keyed release.
      DATABASE_URL: postgres://tanren_app:${TANREN_APP_DB_PASSWORD:?TANREN_APP_DB_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      MIGRATION_DATABASE_URL: postgres://tanren:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      TANREN_SYSTEM_DATABASE_URL: postgres://tanren_system:${TANREN_SYSTEM_DB_PASSWORD:?TANREN_SYSTEM_DB_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      # The allocator has NO Vault / secret-store access: it never resolves a
      # secret VALUE (the CODEX_HOME env-bundle channel is removed). Run-scoped
      # runner creds are delivered over the SSH FILE substrate by the orchestrator
      # after allocation, so the allocator only touches Docker + the runners table.
      ALLOCATOR_PORT: "3200"
      # The bearer token gating `/allocate` + `/release` is delivered as a MOUNTED
      # SECRET FILE (the `tanren_allocator_token` compose secret, wired below), never
      # an env VALUE. main.ts reads it file-preferred (requireSecretEnv) — both ends
      # of the sidecar bearer-token pair read from the same mounted file.
      TANREN_ALLOCATOR_TOKEN_FILE: /run/secrets/tanren_allocator_token
      TANREN_ALLOCATOR_NETWORK: ${COMPOSE_PROJECT_NAME:-tanren}_default
      TANREN_ALLOCATOR_SSH_HOSTNAME_TEMPLATE: "{container}"
      TANREN_MAX_RUN_HOURS: ${TANREN_MAX_RUN_HOURS:-6}
      # NOTE: the runner image is NOT a platform env knob — the allocator reads it
      # from each /allocate request body (the orchestrator threads the project's
      # configured runnerImage, defaulting to DEFAULT_BASE_SHIFT_RUNNER_IMAGE). A
      # TANREN_RUNNER_IMAGE env here would be dead config, so it is intentionally
      # absent.
      TANREN_RUNNER_AUTHORIZED_KEY: ${TANREN_RUNNER_AUTHORIZED_KEY:?TANREN_RUNNER_AUTHORIZED_KEY must be set for the prod profile}
    volumes:
      # Container-runtime socket (same shape as compose.dev.yml). Operators on
      # rootless podman set TANREN_DOCKER_SOCK=/run/user/$UID/podman/podman.sock.
      - ${TANREN_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    # The allocator bearer token, mounted as a file (never an env value) — the same
    # secret the orchestrator + worker read.
    secrets:
      - tanren_allocator_token

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    environment:
      DATABASE_URL: postgres://tanren:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the prod profile}@postgres:5432/tanren
      ORCHESTRATOR_URL: http://orchestrator:3100
      DASHBOARD_PORT: "3000"
      # Fail-closed auth profile (CX-006): NODE_ENV=production makes
      # TANREN_REQUIRE_AUTH default ON when unset, requires ORCHESTRATOR_URL,
      # and refuses TANREN_DEV_LOGIN even if accidentally set. compose.dev.yml
      # leaves NODE_ENV unset so local/CI smoke stays open unless opted in.
      NODE_ENV: production
      TANREN_ENV: production
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  ntfy:
    image: binwiederhier/ntfy:latest
    command: ["serve"]

  ## P3-0030: Cloudflare Tunnel exposure profile. OFF by default — it only
  ## starts under the `tunnel` profile:
  ##   docker compose -f compose.prod.yml --profile tunnel up
  ## The tunnel token is supplied via CLOUDFLARED_TUNNEL_TOKEN (never committed);
  ## the named tunnel's public hostname -> service routing (e.g. the dashboard on
  ## the internal docker network) is configured in the Cloudflare Zero Trust
  ## dashboard. cloudflared terminates TLS at Cloudflare's edge and dials the
  ## origin over the internal docker network, so no host port needs to be
  ## published when the tunnel is in use. See docs/operator-guide/deploy.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      ## Soft default so `docker compose config` validates the base profile
      ## (compose interpolates all services regardless of profile). The token is
      ## only consulted when the `tunnel` profile actually starts; supply it then
      ## via env / secret manager — cloudflared exits immediately on an empty
      ## token. Never commit a real value.
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      dashboard:
        condition: service_started

volumes:
  pgdata:

secrets:
  # The orchestrator's SSH PRIVATE key, delivered to the orchestrator + worker as
  # a mounted file under /run/secrets (never an env value). Point
  # TANREN_RUNNER_IDENTITY_KEY_FILE at the key file on the host; compose mounts it
  # read-only. Self-contained — no out-of-band mount step required.
  tanren_runner_identity_key:
    file: ${TANREN_RUNNER_IDENTITY_KEY_FILE:?TANREN_RUNNER_IDENTITY_KEY_FILE must be set for the prod profile (host path to the SSH private key file)}
  # The broad Vault token — the SINGLE source for both the Vault server's dev-mode
  # ROOT token (the `vault` service's entrypoint reads this file to seed
  # `-dev-root-token-id`) AND the broad CLIENT token the orchestrator + worker read
  # (VAULT_TOKEN_FILE). Delivered as a mounted file under /run/secrets (never an env
  # VALUE — so it never lands in `docker inspect`). The SecretStore factory reads the
  # token from this file at boot and holds it in-memory; it is never force-exported
  # into the process env. Point TANREN_VAULT_TOKEN_FILE at a host file containing ONLY
  # the token (mirrors the SSH-key pattern). The old `VAULT_ROOT_TOKEN` env (the
  # plaintext Vault dev-mode root-token-id) is GONE — this file is the only place the
  # root/broad token lives.
  tanren_vault_token:
    file: ${TANREN_VAULT_TOKEN_FILE:?TANREN_VAULT_TOKEN_FILE must be set for the prod profile (host path to a file containing the Vault token)}
  # The GitHub OAuth client SECRET, delivered to the orchestrator as a mounted file
  # under /run/secrets (never an env VALUE — so it never lands in `docker inspect`).
  # mainAuth reads it file-preferred from TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE.
  # Point TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE at a host file containing ONLY the
  # secret.
  tanren_github_oauth_client_secret:
    file: ${TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE:?TANREN_GITHUB_OAUTH_CLIENT_SECRET_FILE must be set for the prod profile (host path to a file containing the GitHub OAuth client secret)}
  # The allocator sidecar bearer token, delivered to the orchestrator + worker +
  # allocator as a mounted file under /run/secrets (never an env VALUE). Both ends of
  # the bearer-token pair read it file-preferred from TANREN_ALLOCATOR_TOKEN_FILE.
  # Point TANREN_ALLOCATOR_TOKEN_FILE at a host file containing ONLY the token.
  tanren_allocator_token:
    file: ${TANREN_ALLOCATOR_TOKEN_FILE:?TANREN_ALLOCATOR_TOKEN_FILE must be set for the prod profile (host path to a file containing the allocator bearer token)}

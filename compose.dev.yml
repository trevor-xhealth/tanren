services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tanren
      POSTGRES_USER: tanren
      POSTGRES_PASSWORD: tanren
    ports:
      # Host port is remappable (default 5432) via TANREN_POSTGRES_HOST_PORT or
      # the bulk-shift TANREN_PORT_OFFSET (see `just up-dev`). In-container 5432.
      - "${TANREN_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanren -d tanren"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql

  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      # Host port is remappable (default 18200) via TANREN_VAULT_HOST_PORT or
      # the bulk-shift TANREN_PORT_OFFSET (see `just up-dev`). In-container 8200.
      - "${TANREN_VAULT_HOST_PORT:-18200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      # RLS R3b (enforcement flip). DATABASE_URL is now the RUNTIME connection as
      # the restricted `tanren_app` role (NOBYPASSRLS, migration 0029): every
      # request/worker tenant query runs under it, and the policies enabled in
      # migration 0030 enforce org isolation at the DATABASE. MIGRATION_DATABASE_URL
      # is the OWNER (`tanren`) connection used ONLY for the migrate step
      # (CREATE/ALTER TABLE + CREATE POLICY stay owner-driven; the owner bypasses
      # RLS as table owner). TANREN_SYSTEM_DATABASE_URL is the narrow BYPASSRLS
      # `tanren_system` role (migration 0030) that `runWithSystemScope` connects
      # as for genuinely cross-org system reads (the reaper's lineage sweep, the
      # hello fixture's cross-org seeding). See ROADMAP.md.
      DATABASE_URL: postgres://tanren_app:tanren_app@postgres:5432/tanren
      MIGRATION_DATABASE_URL: postgres://tanren:tanren@postgres:5432/tanren
      TANREN_SYSTEM_DATABASE_URL: postgres://tanren_system:tanren_system@postgres:5432/tanren
      # The secret-store backend is now REQUIRED (no implicit `vault` default).
      TANREN_SECRET_STORE: vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      ORCHESTRATOR_PORT: "3100"
      # SYSTEM credential split: the orchestrator's SSH PRIVATE key is delivered as
      # a MOUNTED SECRET FILE (the `tanren_runner_identity_key` compose secret,
      # wired below) — never a plaintext env VALUE, so it never lands in `docker
      # inspect` / container env. Mirrors compose.prod.yml. The boot seeder reads
      # the file at this in-container path and stores it in the secret store. The
      # `runner-key` justfile recipe generates the dev key at
      # $TANREN_RUNTIME_DIR/tanren_runner_key (persistent, not /tmp).
      TANREN_RUNNER_IDENTITY_KEY_PATH: /run/secrets/tanren_runner_identity_key
      TANREN_GITHUB_OAUTH_CLIENT_ID: ${TANREN_GITHUB_OAUTH_CLIENT_ID:-}
      TANREN_GITHUB_OAUTH_CLIENT_SECRET: ${TANREN_GITHUB_OAUTH_CLIENT_SECRET:-}
      TANREN_PUBLIC_BASE_URL: ${TANREN_PUBLIC_BASE_URL:-http://localhost:3100}
      # Explicit non-prod profile marker required for TANREN_DEV_LOGIN (the hatch
      # refuses unset profiles — cookie-secure-off alone never enables it).
      TANREN_ENV: dev
      # DEV-ONLY sign-in escape hatch (feat/dev-login-escape-hatch). OPT-IN via
      # host env, default OFF: when empty, buildAuthFromEnv returns undefined and
      # no auth middleware mounts (so the open smoke flow is unaffected). Set
      # TANREN_DEV_LOGIN=1 (copy .env.example to .env) to register the local_dev
      # provider, then open the dashboard, click "sign in (dev)", and land
      # authenticated against the synthetic `tanren-dev` org. compose.prod.yml
      # MUST never set this flag. See docs/operator-guide/auth.md.
      TANREN_DEV_LOGIN: ${TANREN_DEV_LOGIN:-}
      # Plane-split topology: this compose profile always runs the data plane in
      # the standalone `worker` service, so the API process must not also dequeue
      # runs in-process. Keep this literal empty value so a host/.env
      # TANREN_RUN_WORKER=1 cannot create duplicate run/merge loops.
      TANREN_RUN_WORKER: ""
      # Dev profile: orchestrator routes /hello/run to the long-lived static
      # `runner` service over the compose network. The allocator sidecar is
      # still up for parity with prod (and to service ephemeral runs), but
      # the smoke flow doesn't require it. Prod compose sets KIND=sidecar.
      TANREN_ALLOCATOR_KIND: static
      TANREN_RUNNER_SSH_HOST: runner
      TANREN_RUNNER_SSH_PORT: "22"
      TANREN_RUNNER_SSH_USER: tanren
      TANREN_ALLOCATOR_URL: http://allocator:3200
      TANREN_ALLOCATOR_TOKEN: dev
      # Plane-split P2: the control-plane INTERNAL mTLS listener serving
      # `/internal/claim-job` (the endpoint the worker claims through). Certs are
      # the dev self-signed material `just gen-mtls-certs` writes to
      # $TANREN_RUNTIME_DIR/mtls (bind-mounted below). When unset the listener does not
      # start (single-process dev); here we always wire it so the worker can claim
      # over mTLS. See ROADMAP.md.
      TANREN_INTERNAL_MTLS_PORT: "3110"
      TANREN_INTERNAL_TLS_CERT: /etc/tanren/mtls/server.crt
      TANREN_INTERNAL_TLS_KEY: /etc/tanren/mtls/server.key
      TANREN_INTERNAL_TLS_CA: /etc/tanren/mtls/ca.crt
    volumes:
      - ${TANREN_RUNTIME_DIR}/mtls:/etc/tanren/mtls:ro
    secrets:
      - tanren_runner_identity_key
    ports:
      # Host port is remappable (default 3100) via TANREN_ORCHESTRATOR_HOST_PORT
      # or the bulk-shift TANREN_PORT_OFFSET (see `just up-dev`). In-container 3100.
      - "${TANREN_ORCHESTRATOR_HOST_PORT:-3100}:3100"
      # Plane-split P2: publish the internal mTLS claim listener so the
      # cross-process smoke can act as a data-plane client against it from the
      # host. In a real deployment this stays on the private control↔data network
      # (not host-published); it is exposed here only for the smoke.
      # Host port is remappable (default 3110) via TANREN_INTERNAL_MTLS_HOST_PORT
      # or the bulk-shift TANREN_PORT_OFFSET (see `just up-dev`). In-container 3110.
      - "${TANREN_INTERNAL_MTLS_HOST_PORT:-3110}:3110"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3100/healthz")
            .then(async (response) => {
              if (!response.ok) process.exit(1);
              const body = await response.json();
              if (body.ok !== true) process.exit(1);
            })
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      allocator:
        condition: service_started
      runner:
        condition: service_healthy

  worker:
    # Plane-split P1: the run-executor worker as a STANDALONE deployable (the
    # DATA PLANE). Same image as the orchestrator, but it boots ONLY the worker
    # loop (`worker-main.ts`) — no HTTP server. The orchestrator API no longer
    # runs the worker in-process by default; this container claims jobs from
    # `job_queue` (unchanged DB-CAS) and drives plan→write→check→audit. It shares
    # the SAME DB/Vault/allocator/runner access the in-process worker had — P1 is
    # a process-boundary change only, NO trust change (P2 adds mTLS + shrinks the
    # DB surface, P3 de-privileges to per-run creds). See
    # ROADMAP.md.
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    command: ["pnpm", "--filter", "@tanren/orchestrator", "start:worker"]
    environment:
      # Plane-split P3b (the de-privilege CUTOVER): the data plane's runtime pool
      # now connects as the DE-PRIVILEGED `tanren_dataplane` role (migration 0031),
      # NOT `tanren_app`. That role has NO INSERT/UPDATE/DELETE on `events` and no
      # write on `cost_records` — the two tenant tables the worker no longer writes
      # directly once remote-writes is ON (below). A compromised runner connecting
      # as this role is rejected by Postgres if it tries to forge an event/cost row
      # (the P3b negative test). It KEEPS run/spec/task write grants — the workflow
      # still writes those directly (deferred to a later wave). The reaper's
      # cross-org lineage read still uses the BYPASSRLS `tanren_system` pool (a
      # READ-only system concern, orthogonal to the tenant-write de-privilege). The
      # worker does NOT migrate (the orchestrator owns it — `depends_on` it below),
      # so it carries no MIGRATION_DATABASE_URL.
      DATABASE_URL: postgres://tanren_dataplane:tanren_dataplane@postgres:5432/tanren
      TANREN_SYSTEM_DATABASE_URL: postgres://tanren_system:tanren_system@postgres:5432/tanren
      # The secret-store backend is now REQUIRED (no implicit `vault` default).
      TANREN_SECRET_STORE: vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      # SSH PRIVATE key via the mounted secret FILE (the `tanren_runner_identity_key`
      # compose secret, wired below), never a plaintext env value — same as the
      # orchestrator above; the worker seeds the same runner identity.
      TANREN_RUNNER_IDENTITY_KEY_PATH: /run/secrets/tanren_runner_identity_key
      # Same allocator + static-runner reach the orchestrator's worker path had.
      TANREN_ALLOCATOR_KIND: static
      TANREN_RUNNER_SSH_HOST: runner
      TANREN_RUNNER_SSH_PORT: "22"
      TANREN_RUNNER_SSH_USER: tanren
      TANREN_ALLOCATOR_URL: http://allocator:3200
      TANREN_ALLOCATOR_TOKEN: dev
      # Plane-split P2: the data plane claims over the control-plane mTLS endpoint
      # (NOT direct DB-CAS). TANREN_CLAIM_ENDPOINT_URL + the data-plane client
      # cert (signed by the same CA as the orchestrator's server cert) make
      # bootRunWorker build an HttpJobClaimClient on the mTLS channel. The claim
      # is the SAME atomic CAS — only the transport moved behind mTLS.
      TANREN_CLAIM_ENDPOINT_URL: https://orchestrator:3110
      TANREN_DATA_PLANE_TLS_CERT: /etc/tanren/mtls/worker.crt
      TANREN_DATA_PLANE_TLS_KEY: /etc/tanren/mtls/worker.key
      TANREN_DATA_PLANE_TLS_CA: /etc/tanren/mtls/ca.crt
      # Plane-split P3b (the CUTOVER): remote-writes is now ON BY DEFAULT for the
      # standalone worker — it routes its run-state WRITES (event-append,
      # cost-record insert, run finalize) AND the reaper's dead-letter event
      # through the control-plane `/internal/*` endpoints over the SAME mTLS
      # channel, so the data plane writes `events`/`cost_records` ONLY via the
      # control plane (matching the de-privileged role above). The write endpoint
      # shares the claim host (TANREN_CLAIM_ENDPOINT_URL). The STANDALONE worker
      # (`worker-main.ts`, mode "standalone") now REQUIRES remote-writes + the mTLS
      # claim endpoint: booting with TANREN_DATA_PLANE_REMOTE_WRITES=0 (or no claim
      # endpoint) is a LOUD boot failure, never a silent revert to direct writes on
      # the de-privileged role (code-integrity r3 finding #5 — no silent fallback).
      # The in-process TANREN_RUN_WORKER=1 dev path keeps direct writes (single
      # process, shares the API pool, no isolation gain — see boot.ts). See ROADMAP.md.
      TANREN_DATA_PLANE_REMOTE_WRITES: ${TANREN_DATA_PLANE_REMOTE_WRITES:-1}
      # Notifications (the worker builds the dispatcher): give the dev/apex stack a
      # REAL default route by default so a warn+ milestone (budget / deploy.verified
      # / needs_attention) on an org that configured no per-org route still reaches
      # the running ntfy topic — never a silent log-and-return. The ntfy service
      # serves on :80 inside the compose network; the bare-topic destination resolves
      # against that base. The onboarding seed adds the per-tenant org route on top;
      # this env default is the process-wide safety net (and what apex mode REQUIRES).
      TANREN_NTFY_BASE_URL: ${TANREN_NTFY_BASE_URL:-http://ntfy:80}
      TANREN_NOTIFICATION_DEFAULT_CHANNEL: ${TANREN_NOTIFICATION_DEFAULT_CHANNEL:-ntfy}
      TANREN_NOTIFICATION_DEFAULT_DESTINATION: ${TANREN_NOTIFICATION_DEFAULT_DESTINATION:-tanren-default-alerts}
      # Merge-reflecting Fly deploy builder (opt-in). The worker boots liveFlyImageBuilder,
      # which shells build-deploy-image.sh (`docker build` + `docker push`). CONTAINER_HOST
      # points the in-image podman client at the MOUNTED host podman socket, so those builds
      # run as `podman --remote` on the host (which owns storage + registry auth). Set
      # TANREN_GITHUB_APP_CREDENTIAL_REF at drive time (the vault ref for the App key that
      # mints the merged-commit tarball token). Absent the builder, a Fly deploy fails loud.
      TANREN_FLY_IMAGE_BUILDER: ${TANREN_FLY_IMAGE_BUILDER:-0}
      TANREN_GITHUB_APP_CREDENTIAL_REF: ${TANREN_GITHUB_APP_CREDENTIAL_REF:-}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    volumes:
      - ${TANREN_RUNTIME_DIR}/mtls:/etc/tanren/mtls:ro
      # The host podman socket — the worker's podman client drives it in REMOTE mode to build
      # + push the per-commit Fly deploy image on the host (rootless podman auto-detected by
      # `just up-dev` into TANREN_DOCKER_SOCK; defaults to the per-user podman socket).
      - ${TANREN_DOCKER_SOCK:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
    secrets:
      - tanren_runner_identity_key
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      allocator:
        condition: service_started
      runner:
        condition: service_healthy
      # The orchestrator owns the migrate step; wait for it before claiming jobs.
      orchestrator:
        condition: service_healthy

  allocator:
    build:
      context: .
      dockerfile: services/allocator/Dockerfile
    environment:
      # RLS R3b: the allocator is partly a cross-org SYSTEM service (it reaps
      # runners across all tenants). Migrations run as owner
      # (MIGRATION_DATABASE_URL). It runs TWO runtime pools: the BYPASSRLS
      # `tanren_system` role (TANREN_SYSTEM_DATABASE_URL) for cross-org sweep +
      # release, and the RESTRICTED app-role pool (DATABASE_URL, via
      # `runWithOrgScope`) for the per-run `runners` INSERT so that tenant row is
      # written WITHIN RLS. In single-role dev DATABASE_URL is the owner role and
      # both behave identically (no enforced policies).
      DATABASE_URL: postgres://tanren:tanren@postgres:5432/tanren
      MIGRATION_DATABASE_URL: postgres://tanren:tanren@postgres:5432/tanren
      TANREN_SYSTEM_DATABASE_URL: postgres://tanren_system:tanren_system@postgres:5432/tanren
      # The allocator has NO Vault / secret-store access — it never resolves a
      # secret VALUE (the CODEX_HOME env-bundle channel is removed). Runner creds
      # are delivered over the SSH FILE substrate by the orchestrator.
      ALLOCATOR_PORT: "3200"
      TANREN_ALLOCATOR_TOKEN: dev
      TANREN_ALLOCATOR_NETWORK: ${COMPOSE_PROJECT_NAME:-tanren}_default
      TANREN_ALLOCATOR_SSH_HOSTNAME_TEMPLATE: "{container}"
      TANREN_MAX_RUN_HOURS: "6"
      # Runner image is per-allocate request config, not an allocator env knob —
      # the allocator never reads TANREN_RUNNER_IMAGE (see compose.prod.yml note).
      TANREN_RUNNER_AUTHORIZED_KEY: ${TANREN_RUNNER_AUTHORIZED_KEY:-}
    volumes:
      # Container-runtime socket the allocator drives to create runner containers.
      # Docker hosts get the default; rootless podman operators override via
      # TANREN_DOCKER_SOCK (pointed at the per-user podman socket). `just up-dev`
      # auto-detects between the two. See justfile + apex-run-playbook §1.
      - ${TANREN_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      # Host port is remappable (default 3200) via TANREN_ALLOCATOR_HOST_PORT or
      # the bulk-shift TANREN_PORT_OFFSET (see `just up-dev`). In-container 3200.
      - "${TANREN_ALLOCATOR_HOST_PORT:-3200}:3200"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    environment:
      DATABASE_URL: postgres://tanren:tanren@postgres:5432/tanren
      ORCHESTRATOR_URL: http://orchestrator:3100
      DASHBOARD_PORT: "3000"
      # Explicit non-prod profile marker required for TANREN_DEV_LOGIN.
      TANREN_ENV: dev
      # OPT-IN via host env, default OFF (keeps CI smoke open). Set to 1 to
      # exercise the auth gate so the sign-in flow is actually driven in dev.
      TANREN_REQUIRE_AUTH: ${TANREN_REQUIRE_AUTH:-}
      # DEV-ONLY sign-in escape hatch (must match the orchestrator flag above).
      # OPT-IN via host env, default OFF. Set TANREN_DEV_LOGIN=1 (copy
      # .env.example to .env) to drive the orchestrator's local_dev provider and
      # surface a visible "sign in (dev)" button at /signin. compose.prod.yml
      # MUST never set it. See docs/operator-guide/auth.md.
      TANREN_DEV_LOGIN: ${TANREN_DEV_LOGIN:-}
    ports:
      # Host port is remappable (default 3000) when :3000 is taken; in-container stays 3000.
      - "${DASHBOARD_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  runner:
    # Dev-only static runner: backward-compat target for `just smoke`'s direct
    # SSH proof and the host-side live integration tests. Production removes
    # this service entirely; the allocator sidecar creates ephemeral runners
    # on demand. See docs/operator-guide/runners.md.
    build:
      context: .
      dockerfile: runner/Dockerfile
    cap_add:
      - SYS_ADMIN
    environment:
      TANREN_RUNNER_AUTHORIZED_KEY: ${TANREN_RUNNER_AUTHORIZED_KEY:-}
    ports:
      # Host port is remappable (default 2222) via TANREN_RUNNER_SSH_HOST_PORT or
      # the bulk-shift TANREN_PORT_OFFSET (see `just up-dev`). In-container sshd 22.
      - "${TANREN_RUNNER_SSH_HOST_PORT:-2222}:22"
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  ntfy:
    image: binwiederhier/ntfy:latest
    command: ["serve"]
    ports:
      # Default host port shifted off 8080 (common conflict — Tomcat, qBittorrent,
      # gatus, dozzle, hokora). Override with TANREN_NTFY_HOST_PORT when needed.
      - "${TANREN_NTFY_HOST_PORT:-18080}:80"

  # Local OCI registry (CNCF distribution / registry:2) — the self-hosted image +
  # build-cache backend the golden-image pipeline pushes to and the later phases
  # resolve env images from (environment-management.md §3 Layer 3 + §4 + §7 P2/P3).
  # ADDITIVE: the dev `runner` service still builds from runner/Dockerfile via
  # `build:` (unchanged) — the registry is what makes P3/P4 (env_key registry HEAD
  # match → seed/JIT-build) LOCALLY validatable with NO cloud. The golden-image
  # build (`just build-golden-image` with PUSH=1 REGISTRY=localhost:5000) pushes
  # `tanren-runner:golden-<digest>` (+ a `buildcache` ref, mode=max) here. Published
  # on host :5000 so the host-side build script can push; data persists in the
  # `registrydata` volume so the warm build cache survives `up-dev`/`down-dev`.
  registry:
    image: registry:2
    environment:
      # Allow image DELETEs so the trim/refresh pass can prune superseded golden
      # digests (env-management.md §3 "continuous refresh + trim").
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "${TANREN_REGISTRY_HOST_PORT:-5000}:5000"
    healthcheck:
      # registry:2 has no shell/curl; probe the v2 API with its bundled wget.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - registrydata:/var/lib/registry

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}

volumes:
  pgdata:
  # Persists the local OCI registry's blobs + the golden-image build cache across
  # `up-dev`/`down-dev` so a refresh is a warm push, not a cold re-upload.
  registrydata:

secrets:
  # The orchestrator's SSH PRIVATE key, delivered to the orchestrator + worker as a
  # MOUNTED FILE under /run/secrets (never a plaintext env value — so it never lands
  # in `docker inspect`). Mirrors compose.prod.yml's pattern; the boot seeder reads
  # the file and stores it in the secret store. The dev key is generated at
  # $TANREN_RUNTIME_DIR/tanren_runner_key by the `runner-key` justfile recipe
  # (`up-dev` depends on it). This is a PERSISTENT user dir (default
  # $HOME/.config/tanren/runtime), NOT /tmp — so a systemd-tmpfiles sweep can't
  # delete the key from under a multi-hour run and break worker restarts. Override
  # the base dir via TANREN_RUNTIME_DIR. NOTE: podman-compose (1.5.x) cannot expand
  # a nested `${A:-${B}}` default, so this consumes the resolved base directly; the
  # justfile exports it, and .env.example seeds it for raw `docker compose` use.
  tanren_runner_identity_key:
    file: ${TANREN_RUNTIME_DIR}/tanren_runner_key
